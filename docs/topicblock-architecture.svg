<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TopicBlock privacy-first browser extension architecture</title>
  <desc id="desc">Browser content is segmented by the extension, sent through native messaging to a local Python service, scored by local models, and returned as filtering actions without remote servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f4ed"/>
      <stop offset="1" stop-color="#e8e6dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#141413" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="60" y="58" width="1080" height="559" rx="28" fill="#faf9f5" stroke="#d1cfc5"/>
  <text x="100" y="116" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#c96442" letter-spacing="2">TOPICBLOCK</text>
  <text x="100" y="158" font-family="Georgia, serif" font-size="42" fill="#141413">Local topic and sentiment filtering</text>
  <text x="100" y="190" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5e5d59">Page text stays on the user's machine. The extension fails open if the native service is unavailable.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="252" width="230" height="185" rx="18" fill="#243b34"/>
    <text x="128" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97757" letter-spacing="1.4">BROWSER</text>
    <text x="128" y="335" font-family="Georgia, serif" font-size="28" fill="#faf9f5">Extension</text>
    <text x="128" y="370" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">DOM segmentation</text>
    <text x="128" y="396" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">Site adapters</text>
    <text x="128" y="422" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">Blur / hide / remove</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="486" y="252" width="230" height="185" rx="18" fill="#ffffff" stroke="#d1cfc5"/>
    <text x="514" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#c96442" letter-spacing="1.4">LOCAL BRIDGE</text>
    <text x="514" y="335" font-family="Georgia, serif" font-size="28" fill="#141413">Native messaging</text>
    <text x="514" y="370" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e5d59">Typed protocol</text>
    <text x="514" y="396" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e5d59">Fail-open transport</text>
    <text x="514" y="422" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5e5d59">Local telemetry</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="872" y="252" width="230" height="185" rx="18" fill="#141413"/>
    <text x="900" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97757" letter-spacing="1.4">PYTHON</text>
    <text x="900" y="335" font-family="Georgia, serif" font-size="28" fill="#faf9f5">Native service</text>
    <text x="900" y="370" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">Text extraction</text>
    <text x="900" y="396" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">Topic + sentiment models</text>
    <text x="900" y="422" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d8d5c9">SQLite cache</text>
  </g>

  <path d="M 350 344 L 462 344" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round"/>
  <path d="M 450 332 L 466 344 L 450 356" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 736 344 L 848 344" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round"/>
  <path d="M 836 332 L 852 344 L 836 356" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="500" width="1000" height="58" rx="16" fill="#f0eee6" stroke="#d1cfc5"/>
  <circle cx="134" cy="529" r="8" fill="#6f7d59"/>
  <text x="154" y="535" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4d4c48">No remote API is required for page analysis. Filtering is additive: if the local service fails, content remains visible.</text>
</svg>
