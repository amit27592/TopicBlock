[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topicblock-native"
version = "0.1.0"
description = "TopicBlock native inference component — ML backend for the browser extension."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8",
]
ml = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "vaderSentiment>=3.3",
    "transformers>=4.40",
    "lxml>=5.0",
    "readability-lxml>=0.8",
    "fasttext-langdetect>=1.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["topicblock_native*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
